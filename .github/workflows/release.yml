name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# When upgrading Lazarus, update the package file names in each install step (the embedded FPC version naming is irregular and cannot be fully parameterized).
env:
  LAZ_VER: "4.8"
  SF: "https://downloads.sourceforge.net/project/lazarus"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-latest
            cpu: x86_64
            target-os: win64
            widgetset: win32
            bin: CodingTool.exe

          - name: windows-x86
            runs-on: windows-latest
            cpu: i386
            target-os: win32
            widgetset: win32
            bin: CodingTool.exe

          - name: linux-amd64
            runs-on: ubuntu-latest
            cpu: x86_64
            target-os: linux
            widgetset: gtk2
            bin: CodingTool

          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            cpu: aarch64
            target-os: linux
            widgetset: gtk2
            bin: CodingTool

          - name: macos-x64
            runs-on: macos-15-intel
            cpu: x86_64
            target-os: darwin
            widgetset: cocoa
            bin: CodingTool

          # Xcode 16's new linker (ld-prime) crashes when linking FPC 3.2.x aarch64 output; -k-ld_classic switches back to the classic linker (deprecated since Xcode 16).
          - name: macos-arm64
            runs-on: macos-15
            cpu: aarch64
            target-os: darwin
            widgetset: cocoa
            bin: CodingTool
            link-opt: -k-ld_classic

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lazarus (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          $ErrorActionPreference = "Stop"
          $base = "$env:SF/Lazarus%20Windows%2064%20bits/Lazarus%20$env:LAZ_VER"
          $silent = @("/VERYSILENT","/SP-","/NORESTART","/DIR=C:\Lazarus")
          curl.exe -fSL -o "$env:RUNNER_TEMP\laz.exe" "$base/lazarus-$env:LAZ_VER-fpc-3.2.2-win64.exe"
          Start-Process -Wait -FilePath "$env:RUNNER_TEMP\laz.exe" -ArgumentList $silent
          # 32-bit target: add the i386-win32 cross-compile add-on on top of the win64 toolchain.
          if ($env:CPU -eq "i386") {
            curl.exe -fSL -o "$env:RUNNER_TEMP\cross.exe" "$base/lazarus-$env:LAZ_VER-fpc-3.2.2-cross-i386-win32-win64.exe"
            Start-Process -Wait -FilePath "$env:RUNNER_TEMP\cross.exe" -ArgumentList $silent
          }
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Lazarus"

      - name: Install Lazarus (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          set -euo pipefail
          sudo apt-get update
          if [[ "$CPU" == "aarch64" ]]; then
            folder="Lazarus%20Linux%20arm64%20DEB"
            fpclaz="fpc-laz_3.2.3-240813_arm64.deb"
            fpcsrc="fpc-src_3.2.3-240813_arm64.deb"
            proj="lazarus-project_4.8.0-0_arm64.deb"
          else
            folder="Lazarus%20Linux%20amd64%20DEB"
            fpclaz="fpc-laz_3.2.2-210709_amd64.deb"
            fpcsrc="fpc-src_3.2.2-210709_amd64.deb"
            proj="lazarus-project_4.8.0-0_amd64.deb"
          fi
          base="$SF/$folder/Lazarus%20$LAZ_VER"
          for f in "$fpclaz" "$fpcsrc" "$proj"; do
            curl -fSL -o "$f" "$base/$f"
          done
          # Install the .deb files with apt so dependencies like gtk2/gdb are resolved (dpkg -i does not).
          sudo apt-get install -y "./$fpclaz" "./$fpcsrc" "./$proj"
          lazbuild --version

      - name: Install Lazarus (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CPU: ${{ matrix.cpu }}
        run: |
          set -euo pipefail
          # macos-15 / macos-15-intel default to Xcode 16.4, whose linker is incompatible with FPC 3.2.x; switch to the preinstalled 16.2.
          XC="/Applications/Xcode_16.2.app/Contents/Developer"
          if [[ ! -d "$XC" ]]; then echo "Xcode 16.2 not found on runner image"; exit 1; fi
          sudo xcode-select -s "$XC"
          echo "DEVELOPER_DIR=$XC" >> "$GITHUB_ENV"
          if [[ "$CPU" == "aarch64" ]]; then
            folder="Lazarus%20macOS%20aarch64"; lazzip="lazarus-darwin-aarch64-${LAZ_VER}.zip"
          else
            folder="Lazarus%20macOS%20x86-64"; lazzip="lazarus-darwin-x86_64-${LAZ_VER}.zip"
          fi
          base="$SF/$folder/Lazarus%20$LAZ_VER"
          # The FPC in the dmg is an intel+arm64 universal build shared by both architectures.
          curl -fSL -o fpc.dmg "$base/fpc-3.2.4rc1a.intelarm64-macosx.dmg"
          curl -fSL -o laz.zip "$base/$lazzip"
          hdiutil attach fpc.dmg -nobrowse -mountpoint /tmp/fpcdmg
          find /tmp/fpcdmg -name '*.pkg' -exec sudo installer -pkg {} -target / \;
          hdiutil detach /tmp/fpcdmg
          # Remove the quarantine attribute from the download, otherwise the extracted files cannot be executed.
          xattr -cr laz.zip || true
          mkdir -p "$HOME/laz"
          unzip -q laz.zip -d "$HOME/laz"
          lb="$(find "$HOME/laz" -name lazbuild -type f | head -1)"
          if [[ -z "$lb" ]]; then echo "lazbuild not found in zip"; exit 1; fi
          # lazbuild's built-in LazarusDir defaults to /Developer/lazarus; override it with the actual directory (the Lazarus root).
          lazdir="$(dirname "$lb")"
          chmod +x "$lb"
          echo "$lazdir" >> "$GITHUB_PATH"
          echo "LAZARUS_DIR=$lazdir" >> "$GITHUB_ENV"
          "$lb" --lazarusdir="$lazdir" --version

      - name: Build
        shell: bash
        # Release options: -g- disables debug info (overrides dsDwarf3 in the .lpi), -O3 optimizes, -CX/-XX smart-link away dead code, -Xs strips. About 29MB -> 7MB.
        run: |
          # The zip-distributed lazbuild on macOS needs the Lazarus directory passed explicitly; installers configure it on other platforms, so leave it empty there.
          EXTRA=""
          [ -n "${LAZARUS_DIR:-}" ] && EXTRA="--lazarusdir=${LAZARUS_DIR}"
          lazbuild --no-write-project -B $EXTRA \
            --cpu=${{ matrix.cpu }} \
            --operating-system=${{ matrix.target-os }} \
            --widgetset=${{ matrix.widgetset }} \
            --opt="-g- -O3 -CX -XX -Xs ${{ matrix.link-opt }}" \
            CodingTool.lpi
          ls -la "${{ matrix.bin }}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ matrix.name }}
          BIN: ${{ matrix.bin }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$env:BIN" -DestinationPath "dist/CodingTool-$env:VERSION-$env:NAME.zip" -Force

      # Install nfpm to build deb/rpm/archlinux/apk from a single config. go install is architecture-independent, so it also works on arm64 runners.
      - name: Install nfpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ matrix.name }}
          BIN: ${{ matrix.bin }}
          CPU: ${{ matrix.cpu }}
        run: |
          set -euo pipefail
          mkdir -p dist
          chmod +x "$BIN"
          # Portable archive (no package manager required).
          tar czf "dist/CodingTool-${VERSION}-${NAME}.tar.gz" "$BIN"
          # nfpm canonical architecture names: x86_64->amd64, aarch64->arm64.
          case "$CPU" in
            x86_64)  export PKG_ARCH="amd64" ;;
            aarch64) export PKG_ARCH="arm64" ;;
            *)       export PKG_ARCH="$CPU" ;;
          esac
          # Package versions must be dot-separated numbers; invalid values such as dev builds fall back to 0.0.0.
          pkg_ver="${VERSION#v}"
          [[ "$pkg_ver" =~ ^[0-9]+(\.[0-9]+)*$ ]] || pkg_ver="0.0.0"
          export PKG_VERSION="$pkg_ver"
          for p in deb rpm archlinux apk; do
            nfpm package -f packaging/nfpm.yaml -p "$p" -t dist/
          done
          ls -la dist/

      # Cocoa GUI apps must ship as a .app bundle, otherwise there is no Dock icon and the menu bar misbehaves.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          NAME: ${{ matrix.name }}
          BIN: ${{ matrix.bin }}
        run: |
          plist_ver="${VERSION#v}"
          [[ "$plist_ver" =~ ^[0-9]+(\.[0-9]+)*$ ]] || plist_ver="0.0.0"
          app="CodingTool.app"
          # In the .app generated by lazbuild, Contents/MacOS/CodingTool is only a symlink to the binary in the project root
          # (relative path ../../../CodingTool). The target does not exist after the archive is extracted, so replace it with the real binary.
          # Do not use -f to check whether it exists: it follows the symlink and is always true on the build machine.
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          # Copy to a temp directory first (cp follows the source symlink to get the real content), then overwrite, so the file is not truncated when source and target link to each other.
          cp "$BIN" "$RUNNER_TEMP/CodingTool"
          rm -f "$app/Contents/MacOS/CodingTool"
          mv "$RUNNER_TEMP/CodingTool" "$app/Contents/MacOS/CodingTool"
          chmod +x "$app/Contents/MacOS/CodingTool"
          # Add the app icon (the .icns pre-generated in the repository).
          cp CodingTool.icns "$app/Contents/Resources/CodingTool.icns"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>CodingTool</string>
            <key>CFBundleDisplayName</key><string>CodingTool</string>
            <key>CFBundleIdentifier</key><string>com.marjune.codingtool</string>
            <key>CFBundleExecutable</key><string>CodingTool</string>
            <key>CFBundleIconFile</key><string>CodingTool.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${plist_ver}</string>
            <key>CFBundleVersion</key><string>${plist_ver}</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
          </dict>
          </plist>
          PLIST
          # Verify the bundle contains no symlinks (their targets are missing after packaging, which stops the .app from launching).
          if find "$app" -type l | grep -q .; then
            echo "Error: the bundle contains symlinks:"
            find "$app" -type l -exec ls -l {} +
            exit 1
          fi
          file "$app/Contents/MacOS/CodingTool"
          mkdir -p dist
          # ditto preserves the bundle structure and executable permissions.
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/CodingTool-${VERSION}-${NAME}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: CodingTool-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Delete the old Release first (keeping the tag), then publish directly as a full Release.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --latest
